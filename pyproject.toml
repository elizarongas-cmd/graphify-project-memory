[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-project-memory"
version = "0.3.6"
description = "Structured project state and token metrics companion for Graphify"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrona", email = "elizarongas@gmail.com" }]
dependencies = []

[project.scripts]
gpm = "graphify_project_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
